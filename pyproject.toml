[project]
name = "parade-visitor-analysis"
version = "0.1.0"
description = "Plotly Dash page analysing visitors on St Patrick's Day parade days"
requires-python = ">=3.13"
dependencies = [
    "dash>=4.5.0",
    "flask-compress>=1.26",
    "gunicorn>=27.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
